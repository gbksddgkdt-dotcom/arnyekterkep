<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vezetői Árnyék-Térkép</title>
    
    <!-- Apple PWA Meta tagek -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ÁrnyékTérkép">
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2318181b'/%3E%3Cpath d='M50 15 L85 50 L50 85 L15 50 Z' fill='%23eab308'/%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #0a0a0a; color: #e4e4e7; font-family: 'Open Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; touch-action: pan-y; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        
        .digital-input { 
          background: rgba(39, 39, 42, 0.4); border: 1px solid rgba(82, 82, 91, 0.5); border-radius: 4px; outline: none; 
          color: #f8fafc; transition: all 0.2s; width: 100%; font-family: 'Open Sans', sans-serif; padding: 8px 12px;
        }
        .digital-input:focus { border-color: #eab308; background: rgba(39, 39, 42, 0.8); box-shadow: 0 0 0 1px #eab308; }
        
        .interactive-area { touch-action: none; -webkit-user-select: none; user-select: none; }

        @media print {
            @page { size: A3 landscape; margin: 0; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body, html { 
                background-color: #18181b !important; 
                margin: 0 !important; padding: 0 !important; width: 1587px !important; height: 1122px !important; overflow: hidden !important; display: block !important;
            }
            #root { width: 100%; height: 100%; display: block; }
            .app-container { margin: 0 !important; padding: 0 !important; max-width: none !important; width: 100% !important; background: transparent !important; }
            .print-hidden { display: none !important; }
            
            .main-board { 
                width: 1587px !important; height: 1122px !important; margin: 0 !important; padding: 10mm 15mm !important; 
                border: none !important; border-radius: 0 !important; display: flex !important; flex-direction: column !important;
                justify-content: flex-start !important; box-sizing: border-box !important; box-shadow: none !important;
            }

            header { 
                display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; justify-content: space-between !important; 
                align-items: flex-end !important; width: 100% !important; flex-shrink: 0 !important; margin-bottom: 1rem !important; 
                padding-bottom: 0.5rem !important; border-bottom: 1px solid #3f3f46 !important; 
            }
            .header-left h1 { font-size: 3rem !important; margin-bottom: 0.5rem !important; }
            .header-left h2 { font-size: 1.125rem !important; }
            .header-right { flex: 0 0 35% !important; display: flex !important; flex-direction: row !important; justify-content: flex-end !important; gap: 1.5rem !important; align-items: flex-end !important; }
            .header-right input { max-width: 160px !important; margin-top: 0 !important; font-size: 1.125rem !important; }

            .grid-row { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; flex-grow: 1 !important; height: auto !important; gap: 0 !important; }
            .col-1 { width: 23% !important; padding-right: 1.5rem !important; display: flex !important; flex-direction: column !important; gap: 0.75rem !important; }
            .col-2 { width: 37% !important; border-left: 1px solid #27272a !important; border-right: 1px solid #27272a !important; padding: 0 1.5rem !important; display: flex !important; flex-direction: column !important; gap: 0.75rem !important; height: 100% !important; }
            .col-3 { width: 40% !important; padding-left: 1.5rem !important; display: flex !important; flex-direction: column !important; gap: 0.75rem !important; }
            
            /* Szigorú magasságok és elrendezés nyomtatáskor az összeomlás ellen */
            .svg-container { min-height: 500px !important; height: 500px !important; display: flex !important; justify-content: center !important; align-items: center !important; flex-grow: 1 !important; margin-top: 10px !important; overflow: visible !important; }
            .interactive-area { height: 100% !important; width: 100% !important; display: flex !important; align-items: center !important; justify-content: center !important; }
            .interactive-area > div.relative { height: 100% !important; max-height: 500px !important; width: 100% !important; }
            .svg-container svg { height: 100% !important; max-height: 500px !important; width: 100% !important; max-width: 100% !important; background: transparent !important; overflow: visible !important; }
            
            /* SVG filterek kikapcsolása PDF exportnál, mert eltüntethetik az elemeket */
            svg [filter], svg * { filter: none !important; }

            footer { flex-shrink: 0 !important; margin-top: auto !important; padding-top: 0.75rem !important; padding-bottom: 0 !important; border-top: 1px solid #3f3f46 !important; }
            
            .digital-input { background: transparent !important; border: none !important; border-bottom: 2px dotted #71717a !important; padding: 4px 0 !important; border-radius: 0 !important; box-shadow: none !important; resize: none !important; }

            .gap-10, .gap-8, .gap-6, .gap-12, .gap-5, .gap-4 { gap: 0.75rem !important; }
            .mb-6, .mb-4, .mb-8, .mb-2 { margin-bottom: 0.5rem !important; }
            .mt-8, .mt-6, .mt-4, .mt-2 { margin-top: 0.5rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, forwardRef, useImperativeHandle } = React;

        // --- INTERAKTÍV RAJZPAD KOMPONENS ---
        const DrawingPad = forwardRef(({ children, viewBox, onSvgTap, pencilColor = "#eab308", active = true, mode = "draw" }, ref) => {
          const canvasRef = useRef(null);
          const containerRef = useRef(null);
          const [isDrawing, setIsDrawing] = useState(false);
          const [startPos, setStartPos] = useState({ x: 0, y: 0 });
          const [startTime, setStartTime] = useState(0);

          useImperativeHandle(ref, () => ({
            clear: () => {
              const canvas = canvasRef.current;
              if(canvas) {
                 const ctx = canvas.getContext('2d');
                 ctx.clearRect(0, 0, canvas.width, canvas.height);
              }
            }
          }));

          useEffect(() => {
            if(mode !== "draw") return;
            const canvas = canvasRef.current;
            const container = containerRef.current;
            
            const resize = () => {
              if(!container || !canvas) return;
              const rect = container.getBoundingClientRect();
              const dpr = window.devicePixelRatio || 1;

              const ctx = canvas.getContext('2d');

              // 1. Mentsük el a jelenlegi rajzot, mert az átméretezés törli a Canvast!
              const tempCanvas = document.createElement('canvas');
              tempCanvas.width = canvas.width;
              tempCanvas.height = canvas.height;
              if (canvas.width > 0 && canvas.height > 0) {
                  tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
              }

              // 2. Új méretek beállítása (ez törli a context-et)
              canvas.width = rect.width * dpr;
              canvas.height = rect.height * dpr;
              canvas.style.width = rect.width + 'px';
              canvas.style.height = rect.height + 'px';

              ctx.scale(dpr, dpr);
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.lineWidth = 3;
              ctx.strokeStyle = pencilColor;

              // 3. Visszatöltjük a kimentett rajzot a skálázott vászonra
              if (tempCanvas.width > 0 && tempCanvas.height > 0 && canvas.width > 0) {
                  ctx.save();
                  ctx.setTransform(1, 0, 0, 1, 0, 0); // Visszaállítjuk az eredeti mátrixot a bemásoláshoz
                  ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
                  ctx.restore();
              }
            };
            
            resize();
            window.addEventListener('resize', resize);
            return () => window.removeEventListener('resize', resize);
          }, [pencilColor, mode]);

          const getCoords = (e) => {
            const rect = containerRef.current.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
              x: clientX - rect.left,
              y: clientY - rect.top,
              width: rect.width,
              height: rect.height
            };
          };

          const handleDown = (e) => {
            if(!active) return;
            const pos = getCoords(e);
            setStartPos(pos);
            setStartTime(Date.now());

            if(mode === "draw") {
                setIsDrawing(true);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
          };

          const handleMove = (e) => {
            if (!isDrawing || mode !== "draw") return;
            const pos = getCoords(e);
            const ctx = canvasRef.current.getContext('2d');
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
          };

          const handleUp = (e) => {
            if(!active) return;
            setIsDrawing(false);
            const timeDiff = Date.now() - startTime;
            const pos = getCoords(e);
            const dist = Math.hypot(pos.x - startPos.x, pos.y - startPos.y);

            // Koppintás érzékelése: rövid idő, kevés elmozdulás
            if (timeDiff < 400 && dist < 20 && onSvgTap) {
              const svgX = (pos.x / pos.width) * viewBox.w;
              const svgY = (pos.y / pos.height) * viewBox.h;
              onSvgTap(svgX, svgY);
            }
          };

          return (
            <div className="flex justify-center items-center w-full h-full interactive-area">
                <div ref={containerRef} className="relative group" 
                     style={{ aspectRatio: viewBox.w + '/' + viewBox.h, maxHeight: '100%', maxWidth: '100%' }}
                     onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp}
                     onTouchStart={handleDown} onTouchMove={handleMove} onTouchEnd={handleUp}>
                  <div className="w-full h-full pointer-events-none">{children}</div>
                  {mode === "draw" && (
                    <canvas ref={canvasRef} className="absolute inset-0 z-10 pointer-events-none" />
                  )}
                  <div className="absolute inset-0 z-20 cursor-crosshair" />
                </div>
            </div>
          );
        });

        const App = () => {
          const bodyCanvasRef = useRef(null);
          const radarCanvasRef = useRef(null);
          const fileInputRef = useRef(null);

          const [clientData, setClientData] = useState({ name: '', date: '' });
          const [cardImage, setCardImage] = useState(null);
          const [radarMarkers, setRadarMarkers] = useState([]);
          const [showInstallModal, setShowInstallModal] = useState(false);
          
          const INITIAL_NODES = [
            { id: 0, cx: 150, cy: 50, r: 18 }, { id: 1, cx: 150, cy: 110, r: 8 }, { id: 2, cx: 90, cy: 130, r: 6 },   
            { id: 3, cx: 210, cy: 130, r: 6 }, { id: 4, cx: 150, cy: 160, r: 10 }, { id: 5, cx: 150, cy: 220, r: 10 }, 
            { id: 6, cx: 150, cy: 280, r: 10 }, { id: 7, cx: 70, cy: 220, r: 6 }, { id: 8, cx: 230, cy: 220, r: 6 },  
            { id: 9, cx: 60, cy: 300, r: 5 }, { id: 10, cx: 240, cy: 300, r: 5 }, { id: 11, cx: 110, cy: 300, r: 8 }, 
            { id: 12, cx: 190, cy: 300, r: 8 }, { id: 13, cx: 110, cy: 400, r: 6 }, { id: 14, cx: 190, cy: 400, r: 6 }, 
            { id: 15, cx: 100, cy: 480, r: 5 }, { id: 16, cx: 200, cy: 480, r: 5 }, 
          ];
          
          const [nodes, setNodes] = useState(INITIAL_NODES.map(n => Object.assign({}, n, { state: 0 })));

          const handleBodyTap = (x, y) => {
            setNodes(prev => prev.map(node => {
              if (Math.hypot(node.cx - x, node.cy - y) <= Math.max(node.r + 25, 40)) {
                return Object.assign({}, node, { state: (node.state + 1) % 4 });
              }
              return node;
            }));
          };

          const handleRadarTap = (x, y) => {
            setRadarMarkers(prev => {
              const existingIdx = prev.findIndex(m => Math.hypot(m.x - x, m.y - y) < 25);
              if (existingIdx !== -1) {
                const newMarkers = [...prev];
                const marker = newMarkers[existingIdx];
                if (marker.size >= 3) {
                  newMarkers.splice(existingIdx, 1);
                } else {
                  newMarkers[existingIdx] = Object.assign({}, marker, { size: marker.size + 1 });
                }
                return newMarkers;
              } else {
                return [...prev, { x, y, size: 1, id: Date.now() }];
              }
            });
          };

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onloadend = () => setCardImage(reader.result);
              reader.readAsDataURL(file);
            }
          };

          const generateRadarPoints = (radius, centerX = 250, centerY = 275) => {
            const points = [];
            const angles = [-90, -18, 54, 126, 198];
            angles.forEach(angle => {
              const radian = (angle * Math.PI) / 180;
              points.push((centerX + radius * Math.cos(radian)) + ',' + (centerY + radius * Math.sin(radian)));
            });
            return points.join(' ');
          };
          const radarLevels = [24, 49, 74, 99, 124, 149, 174, 199, 224, 245];

          const handleDownloadSelf = () => {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url; link.download = 'Vezetoi-Arnyek-Terkep-App.html';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
          };

          const handleClearAll = () => {
            if(window.confirm("Biztosan törölsz minden rajzot, fotót és szöveget?")) {
                if (bodyCanvasRef && bodyCanvasRef.current) {
                    bodyCanvasRef.current.clear(); 
                }
                if (radarCanvasRef && radarCanvasRef.current) {
                    radarCanvasRef.current.clear(); 
                }
                setNodes(INITIAL_NODES.map(n => Object.assign({}, n, { state: 0 })));
                setRadarMarkers([]);
                setClientData({ name: '', date: '' });
                setCardImage(null);
                document.querySelectorAll('textarea').forEach(ta => ta.value = '');
            }
          };

          return (
            <div className="min-h-screen flex flex-col items-center py-2 sm:py-4 md:py-8 w-full relative">
              
              {/* iPhone Telepítési Útmutató Modal */}
              {showInstallModal && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4 backdrop-blur-sm print-hidden">
                  <div className="bg-[#18181b] border border-zinc-700 p-6 md:p-8 rounded-2xl max-w-xl w-full shadow-2xl relative">
                    <button onClick={() => setShowInstallModal(false)} className="absolute top-4 right-4 text-zinc-400 hover:text-white">
                       <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    <div className="flex items-center gap-3 mb-6">
                      <span className="text-3xl">📱</span>
                      <h2 className="font-montserrat font-bold text-xl text-zinc-100 uppercase">iPhone App Telepítése</h2>
                    </div>
                    <p className="text-zinc-300 text-sm mb-4">Az Apple szigorú biztonsági szabályai miatt a telefonról megnyitott fájlokon a rendszer letiltja a rajzolást és a kattintást. <strong>A tökéletes App élményhez a Safariból kell a Főképernyőhöz adnod. Ezt így teheted meg 2 perc alatt:</strong></p>
                    
                    <ol className="list-decimal pl-5 text-sm text-zinc-400 space-y-3 font-semibold mb-6">
                      <li>Töltsd le ezt a fájlt a gépedre a kék <span className="text-blue-400">PC LETÖLTÉS</span> gombbal.</li>
                      <li>Nyisd meg a Mac-eden/PC-den az ingyenes <a href="https://tiiny.host" target="_blank" className="text-yellow-500 hover:underline">tiiny.host</a> vagy a <a href="https://app.netlify.com/drop" target="_blank" className="text-yellow-500 hover:underline">Netlify Drop</a> oldalt.</li>
                      <li>Húzd be a letöltött fájlt az oldalra (regisztráció nélkül is feltölti, és ad egy saját linket).</li>
                      <li>Ezt a kapott webcímet (linket) nyisd meg az iPhone-odon a <b>Safari</b> böngészőben!</li>
                      <li>Bökj a Safari alján lévő <b>Megosztás ikonra</b> (négyzet felfelé mutató nyíllal), majd válaszd a <b>Főképernyőhöz adás</b> opciót.</li>
                    </ol>
                    <div className="bg-green-900/30 border border-green-800 p-3 rounded-lg text-xs text-green-400">
                       ✅ Kész! Innentől az Árnyék-Térkép egy önálló, teljes képernyős, saját ikonnal rendelkező, korlátozások nélkül működő alkalmazás lesz a telefonodon!
                    </div>
                  </div>
                </div>
              )}

              <div className="app-container w-full max-w-[1587px] flex flex-col gap-4 sm:gap-6 px-2 sm:px-4">
                
                {/* VEZÉRLŐPULT */}
                <div className="print-hidden w-full bg-zinc-900/95 p-3 rounded-xl border border-zinc-800 flex flex-col lg:flex-row justify-between items-center gap-4 shadow-2xl backdrop-blur-md sticky top-2 z-50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center border border-zinc-700 shadow-inner">⚡</div>
                    <div>
                      <h2 className="font-montserrat font-bold text-zinc-100 text-xs sm:text-sm uppercase tracking-tighter">Árnyék-Térkép App</h2>
                      <p className="text-[10px] text-zinc-400">iPhone-on olvasd el a lila gomb instrukcióit!</p>
                    </div>
                  </div>
                  <div className="flex flex-wrap lg:flex-nowrap justify-center gap-2 sm:gap-3 w-full lg:w-auto">
                    <button onClick={handleClearAll} className="px-3 sm:px-4 py-2 rounded-lg font-bold text-[10px] bg-zinc-800 hover:bg-red-900/30 hover:text-red-400 text-zinc-300 border border-zinc-700 transition-colors">MINDEN TÖRLÉSE</button>
                    <button onClick={handleDownloadSelf} className="px-3 sm:px-4 py-2 rounded-lg font-montserrat font-bold text-[10px] bg-blue-600 hover:bg-blue-500 text-white shadow-lg transition-all">📥 PC LETÖLTÉS</button>
                    <button onClick={() => setShowInstallModal(true)} className="px-3 sm:px-4 py-2 rounded-lg font-montserrat font-bold text-[10px] bg-purple-600 hover:bg-purple-500 text-white shadow-lg transition-all">📱 iPHONE TELEPÍTÉS</button>
                    <button onClick={() => window.print()} className="px-5 py-2 rounded-lg font-montserrat font-bold text-[10px] bg-yellow-500 hover:bg-yellow-400 text-zinc-900 shadow-lg transition-all">📄 PDF MENTÉS</button>
                  </div>
                </div>

                {/* FŐ TÁBLA */}
                <div id="shadow-map-content" className="main-board w-full bg-[#18181b] shadow-2xl rounded-2xl p-4 lg:p-12 border border-zinc-800 flex flex-col gap-6 relative overflow-hidden">
                  
                  <header className="flex flex-col lg:flex-row justify-between items-start lg:items-end border-b pb-4 border-zinc-700 gap-4 shrink-0 w-full">
                    <div className="header-left flex-1 text-left w-full">
                      <h1 className="font-montserrat font-black text-2xl md:text-5xl tracking-wider text-zinc-100 mb-1 leading-tight uppercase whitespace-nowrap">VEZETŐI ÁRNYÉK-TÉRKÉP</h1>
                      <h2 className="font-montserrat font-light text-zinc-400 text-[10px] md:text-lg tracking-[0.2em] uppercase">Elemi Integráció – Páncél nélküli teljesítmény</h2>
                    </div>
                    <div className="header-right flex gap-6">
                      <div className="flex items-center gap-2"><span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Kliens:</span><input type="text" className="digital-input font-bold text-lg w-40 md:w-64" value={clientData.name} onChange={e => setClientData(Object.assign({}, clientData, { name: e.target.value }))} /></div>
                      <div className="flex items-center gap-2"><span className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Dátum:</span><input type="text" className="digital-input font-bold w-32 md:w-48" value={clientData.date} onChange={e => setClientData(Object.assign({}, clientData, { date: e.target.value }))} /></div>
                    </div>
                  </header>

                  <main className="grid-row grid grid-cols-1 lg:grid-cols-12 gap-8 flex-grow">
                    
                    {/* OSZLOP 1 */}
                    <section className="col-1 lg:col-span-3 flex flex-col gap-6">
                      <h3 className="font-montserrat font-bold text-lg text-zinc-300 uppercase tracking-widest">1. Az Indikátor</h3>
                      <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                      <div onClick={() => fileInputRef.current.click()} className="w-[150px] h-[225px] border-2 border-dashed border-zinc-700 rounded-xl mx-auto flex items-center justify-center relative overflow-hidden bg-[#1f1f22] cursor-pointer hover:border-zinc-500 transition-all">
                        {cardImage ? <img src={cardImage} className="w-full h-full object-cover" /> : <div className="text-center opacity-30"><span className="text-2xl block">📷</span><span className="text-[10px] uppercase">Dixit Fotó</span></div>}
                      </div>
                      <div className="flex flex-col gap-4 mt-2">
                        <h4 className="font-montserrat font-bold text-zinc-200 tracking-widest border-b border-zinc-700 pb-2 uppercase">A KIVETÜLÉS</h4>
                        <div className="flex flex-col gap-1"><label className="text-[9px] font-bold uppercase text-zinc-500">Az elsődleges érzet</label><textarea rows="2" className="digital-input resize-none text-sm"></textarea></div>
                        <div className="flex flex-col gap-1"><label className="text-[9px] font-bold uppercase text-zinc-500">A paradoxon (Ami nem illik a képbe)</label><textarea rows="2" className="digital-input resize-none text-sm"></textarea></div>
                        <div className="flex flex-col gap-1"><label className="text-[9px] font-bold uppercase text-zinc-500">Az Árnyék mondata</label><textarea rows="2" className="digital-input resize-none font-bold italic text-[#eab308] text-sm" placeholder="„Én vagyok az, aki...”"></textarea></div>
                      </div>
                    </section>

                    {/* OSZLOP 2 (Szkenner) */}
                    <section className="col-2 lg:col-span-5 flex flex-col items-center lg:border-x border-zinc-800 lg:px-6">
                      <h3 className="font-montserrat font-bold text-2xl mb-1 text-zinc-100 uppercase tracking-[0.2em]">TESTI PÁNCÉLZAT</h3>
                      <div className="border border-zinc-700 bg-[#1f1f22] rounded-md p-3 shadow-xl mb-4">
                        <ul className="text-[10px] flex gap-4 text-zinc-300 font-bold uppercase tracking-tighter">
                          <li className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span> Góc</li>
                          <li className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full border-2 border-blue-500 border-dashed"></span> Zsibbadás</li>
                          <li className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-yellow-500"></span> Túlpörgés</li>
                        </ul>
                      </div>
                      <div className="svg-container w-full flex-grow min-h-[420px]">
                        <DrawingPad ref={bodyCanvasRef} viewBox={{w: 300, h: 540}} onSvgTap={handleBodyTap} pencilColor="#38bdf8" mode="draw"> 
                          <svg viewBox="0 0 300 540" className="w-full h-full drop-shadow-2xl">
                            <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
                            <g stroke="#52525b" strokeWidth="1.5" fill="none">
                                <path d="M150,60 L150,110 M150,110 L90,130 M150,110 L210,130 M90,130 L70,220 M210,130 L230,220 M70,220 L60,300 M230,220 L240,300" />
                                <path d="M150,110 L150,220 M150,220 L150,280 M150,280 L110,300 M150,280 L190,300 M110,300 L110,400 M190,300 L190,400 M110,400 L100,480 M190,400 L200,480" />
                            </g>
                            {nodes.map(node => {
                              if (node.state === 0) return <circle key={node.id} cx={node.cx} cy={node.cy} r={node.r} fill="#71717a" stroke="#d4d4d8" strokeWidth="1" />;
                              if (node.state === 1) return <circle key={node.id} cx={node.cx} cy={node.cy} r={node.r + 3} fill="#ef4444" stroke="#7f1d1d" strokeWidth="2" />;
                              if (node.state === 2) return <circle key={node.id} cx={node.cx} cy={node.cy} r={node.r + 2} fill="transparent" stroke="#3b82f6" strokeWidth="2.5" strokeDasharray="3,2" />;
                              if (node.state === 3) return <circle key={node.id} cx={node.cx} cy={node.cy} r={node.r + 4} fill="#eab308" filter="url(#glow)" />;
                              return null;
                            })}
                          </svg>
                        </DrawingPad>
                      </div>
                    </section>

                    {/* OSZLOP 3 (Radar + Eredeti Feliratok) */}
                    <section className="col-3 lg:col-span-4 flex flex-col gap-6">
                      <div className="flex flex-col gap-4">
                        <h3 className="font-montserrat font-bold text-xl text-zinc-300 uppercase tracking-widest">KOGNITÍV HUROK</h3>
                        <div className="bg-zinc-800/20 border border-zinc-700/60 p-4 pt-6 rounded-lg relative">
                          <div className="absolute -top-3 left-4 bg-[#18181b] px-2 text-[11px] font-bold text-zinc-300 uppercase tracking-widest">A „Kell” illúziója</div>
                          <textarea rows="2" className="digital-input resize-none w-full text-sm" placeholder="(Megfelelési kényszer)"></textarea>
                        </div>
                        <div className="bg-zinc-800/20 border border-zinc-700/60 p-4 pt-6 rounded-lg relative">
                          <div className="absolute -top-3 left-4 bg-[#18181b] px-2 text-[11px] font-bold text-zinc-300 uppercase tracking-widest">A Félelem gombja</div>
                          <textarea rows="2" className="digital-input resize-none w-full text-sm" placeholder="(Mi történik, ha leteszem a páncélt?)"></textarea>
                        </div>
                      </div>

                      <div className="flex flex-col flex-grow">
                        <h3 className="font-montserrat font-bold text-xl text-zinc-300 tracking-widest uppercase leading-tight">RENDSZERSZINTŰ TORZÍTÁS</h3>
                        
                        <div className="relative w-full flex justify-center items-center flex-grow min-h-[450px] sm:min-h-[450px] lg:min-h-[420px] mt-2">
                          <DrawingPad ref={radarCanvasRef} viewBox={{w: 500, h: 550}} onSvgTap={handleRadarTap} mode="tap" pencilColor="#eab308"> 
                            <svg viewBox="0 0 500 550" className="w-full h-full max-h-[350px] sm:max-h-[450px] overflow-visible">
                              {/* Radar Háló */}
                              {radarLevels.map((level, i) => (<polygon key={level} points={generateRadarPoints(level, 250, 275)} fill="none" stroke={i === 9 ? "#a1a1aa" : "#3f3f46"} strokeWidth={i === 9 ? "2" : "1"} />))}
                              {[-90, -18, 54, 126, 198].map((angle, i) => { 
                                const rad = (angle * Math.PI) / 180; 
                                return <line key={i} x1="250" y1="275" x2={250 + 245 * Math.cos(rad)} y2={275 + 245 * Math.sin(rad)} stroke="#52525b" strokeWidth="1" strokeDasharray="4,4" />; 
                              })}
                              
                              {/* EREDETI KÉTSOROS FELIRATOK */}
                              <text x="250" y="-5" textAnchor="middle" className="text-[14px] font-bold fill-zinc-100 uppercase tracking-wide">Belső béke és</text>
                              <text x="250" y="12" textAnchor="middle" className="text-[14px] font-bold fill-zinc-100 uppercase tracking-wide">önazonosság</text>

                              <text x="495" y="205" textAnchor="start" className="text-[14px] font-bold fill-zinc-300 uppercase">Személyes kapcsolatok</text>

                              <text x="405" y="490" textAnchor="start" className="text-[14px] font-bold fill-zinc-300 uppercase">Szervezeti jelenlét</text>
                              <text x="405" y="508" textAnchor="start" className="text-[11px] font-bold fill-zinc-500 italic">(döntés, tisztánlátás)</text>

                              <text x="95" y="490" textAnchor="end" className="text-[14px] font-bold fill-zinc-300 uppercase">Fizikai energia és</text>
                              <text x="95" y="508" textAnchor="end" className="text-[14px] font-bold fill-zinc-300 uppercase">egészség</text>

                              <text x="5" y="190" textAnchor="end" className="text-[14px] font-bold fill-zinc-300 uppercase">A valódi szabadság</text>
                              <text x="5" y="208" textAnchor="end" className="text-[14px] font-bold fill-zinc-300 uppercase">megélése</text>
                              
                              {/* INTERAKTÍV PONTOK */}
                              {radarMarkers.map(marker => {
                                const sizes = [0, 8, 16, 26]; 
                                return (
                                  <g key={marker.id} className="pointer-events-none">
                                    <circle cx={marker.x} cy={marker.y} r={sizes[marker.size]} fill="#eab308" opacity={0.7} filter="url(#glow)" />
                                    <circle cx={marker.x} cy={marker.y} r={3} fill="#ffffff" />
                                  </g>
                                );
                              })}
                              <circle cx="250" cy="275" r="5" fill="#f4f4f5" />
                            </svg>
                          </DrawingPad>
                        </div>
                      </div>
                    </section>
                  </main>

                  <footer className="mt-2 pt-6 border-t border-zinc-700 w-full shrink-0">
                    <div className="flex flex-col gap-3">
                      <div className="flex items-center gap-3">
                        <span className="text-zinc-100 font-bold text-2xl">✦</span>
                        <h2 className="font-montserrat font-bold text-xl tracking-[0.2em] uppercase text-zinc-100">AZ INTEGRÁCIÓ LÉPÉSE</h2>
                      </div>
                      <div className="pl-9"><textarea rows="2" className="digital-input font-bold text-lg resize-none border-b-2" placeholder="Írd le a konkrét mikrolépést..."></textarea></div>
                    </div>
                  </footer>

                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
